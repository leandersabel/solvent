version: 2
# A release is proposed only once it has aged, so a compromised one has
# time to be caught and pulled (CLAUDE.md, The loop, Merge gate).
# Security updates are exempt from cooldown and arrive at once.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
