name: Nightly failure
description: Leaves an issue the loop takes up for a failed night.
inputs:
  today:
    description: The night's date
    required: true
  steps:
    description: The final job's steps context, as JSON
    required: true
  needs:
    description: The final job's needs context, as JSON
    default: "{}"
runs:
  using: composite
  steps:
    # Files what QA recorded, as a last resort. Its failure must not
    # stop the issue below.
    - uses: ./.github/actions/qa-file
      continue-on-error: true
    - run: python3 "$GITHUB_ACTION_PATH/report.py"
      shell: bash
      env:
        TODAY: ${{ inputs.today }}
        STEPS: ${{ inputs.steps }}
        NEEDS: ${{ inputs.needs }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
