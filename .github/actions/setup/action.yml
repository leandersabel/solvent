name: Setup
description: Python with the app's dependencies, and Node and Chrome for the browser tests.
runs:
  using: composite
  steps:
    # The tests run on the Python the image runs, which the Dockerfile's
    # FROM line is the one place to state.
    - id: python
      run: echo "version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+)-slim@.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ steps.python.outputs.version }}
        cache: pip
        cache-dependency-path: requirements*.txt
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - run: pip install -r requirements-dev.txt
      shell: bash
    - run: echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      shell: bash
