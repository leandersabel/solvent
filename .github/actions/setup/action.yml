name: Setup
description: Python with the app's dependencies, and Node and Chrome for the browser tests.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements*.txt
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: pip install -r requirements-dev.txt
      shell: bash
    - run: echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      shell: bash
