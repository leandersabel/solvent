name: Build

# Builds the calling workflow's own commit once and pushes it by digest,
# tagged with its commit, with a signed provenance attestation. An image
# that already exists for the commit is verified and reused, so no stage
# rebuilds (CLAUDE.md, The loop, Nightly and stable).
on:
  workflow_call:
    outputs:
      digest:
        description: The image's digest
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # An image under the commit's tag counts only with this workflow's
      # provenance for this commit on master.
      - id: existing
        run: |
          digest=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) || exit 0
          gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --source-ref refs/heads/master --source-digest "$GITHUB_SHA" > /dev/null
          echo "Reusing $IMAGE@$digest, built from $GITHUB_SHA."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - if: steps.existing.outputs.digest == ''
        id: push
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$TAG" .
          docker push "$TAG"
          echo "digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$TAG" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - if: steps.existing.outputs.digest == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
