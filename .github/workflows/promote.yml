name: Promote

# The client marking a nightly as the latest release makes it stable:
# the same image gets `:stable`, the notes cover everything since the
# last stable, and the nightlies before it go (CLAUDE.md, The loop,
# Nightly and stable).
on:
  release:
    types: [released]

permissions: {}

jobs:
  promote:
    if: github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: read
      issues: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only a version QA walked in full is made stable: a successful
      # nightly run on master recorded every feature walked on its commit
      # (nightly.yml). No agent writes that run's artifacts.
      - id: walked
        run: |
          commit=$(git rev-parse "$TAG^{commit}")
          for run in $(gh api "repos/$GH_REPO/actions/workflows/nightly.yml/runs?branch=master&status=success&per_page=100" \
            --jq '.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and .head_repository.id == .repository.id) | .id'); do
            for id in $(gh api "repos/$GH_REPO/actions/runs/$run/artifacts?name=qa-walked" --jq '.artifacts[] | select(.expired | not) | .id'); do
              gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/walked.zip" || continue
              if unzip -p "$RUNNER_TEMP/walked.zip" qa-walked.json | jq -e --arg commit "$commit" '.commit == $commit and .every == true' >/dev/null; then
                echo "QA walked every feature of $TAG in run $run."
                exit 0
              fi
            done
          done
          echo "::error::QA did not walk every feature of $TAG. Run 'gh workflow run nightly.yml -f full=true', which walks today's version in full, and promote that version."
          exit 1
      # A nightly something now holds back is not made stable.
      - id: gate
        uses: ./.github/actions/release-gate
        with:
          commit: ${{ env.TAG }}
          since: ${{ env.TAG }}
      - if: failure() && (steps.walked.outcome == 'failure' || steps.gate.outcome == 'failure')
        run: gh release edit "$TAG" --prerelease
      - run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE:$TAG"
      - run: |
          previous=$(gh release list --exclude-pre-releases --limit 100 --json tagName \
            --jq "map(.tagName) | map(select(. < \"$TAG\")) | max // empty")
          python3 tools/release-notes.py "$previous" "$TAG" > notes.md
          gh release edit "$TAG" --notes-file notes.md
      - run: |
          for old in $(gh release list --limit 100 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease) | select(.tagName < \"$TAG\") | .tagName"); do
            gh release delete "$old" --cleanup-tag --yes
            for id in $(gh api --paginate "users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions" \
              --jq ".[] | select(.metadata.container.tags | index(\"$old\")) | .id"); do
              gh api -X DELETE "users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions/$id"
            done
          done
