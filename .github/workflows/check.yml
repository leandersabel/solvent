name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # The tests read the screens and the QA plan from spec/features/,
        # so a change there runs them.
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null &&
            ! git diff --name-only "$BASE" HEAD | grep -q '^spec/features/' &&
            ! git diff --name-only "$BASE" HEAD | grep -qvE '^(spec/|\.claude/|[^/]+\.md$)'; then
            echo "code=false"
          else
            echo "code=true"
          fi >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: python -m pytest -q

  # The image is what deploys, so it is started the way the README runs
  # it and has to serve a page.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t solvent .
      - run: >-
          docker run -d --name solvent -p 8000:8000
          -e SECRET_KEY="$(openssl rand -hex 32)"
          -v solvent-data:/data
          --read-only --tmpfs /dev/shm:size=64m
          --cap-drop ALL --security-opt no-new-privileges:true
          solvent
      - run: curl -fsS --retry 10 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:8000/login
      - if: failure()
        run: docker logs solvent

  # Every workflow, linted for mistakes and for the weaknesses zizmor
  # knows. Go's checksum database pins actionlint, and pip pins zizmor.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: pipx run zizmor==1.30.1 --offline --min-severity medium .github/workflows

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # A red master blocks the nightly, so it becomes a bug the agent takes
  # up at once (CLAUDE.md, The loop, When something fails).
  report:
    needs: [test, image]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          open=$(gh issue list --state open --label bug --search "in:title \"The checks fail on master\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing at ${{ github.sha }}: $RUN"
          else
            url=$(gh issue create --label bug --title "The checks fail on master" --body "The checks fail on master at ${{ github.sha }}: $RUN")
            gh workflow run agent.yml --ref master -f issue="${url##*/}"
          fi
