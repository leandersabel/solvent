name: Check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: python -m pytest -q

  # The image is what deploys, so it is started the way the README runs
  # it and has to serve a page.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t solvent .
      - run: >-
          docker run -d --name solvent -p 8000:8000
          -e SECRET_KEY="$(openssl rand -hex 32)"
          -v solvent-data:/data
          --read-only --tmpfs /dev/shm:size=64m
          --cap-drop ALL --security-opt no-new-privileges:true
          solvent
      - run: curl -fsS --retry 10 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:8000/login
      - if: failure()
        run: docker logs solvent

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
