name: Triage

# The client commenting on an issue starts the triage routine in
# Anthropic's cloud, with the issue number and nothing else. A new issue
# starts it through the routine's own GitHub trigger, which has no event
# for comments. The routine writes under the client's account, and the
# cloud ends everything it writes with a "Generated by Claude Code"
# line, so the routine's own comments start nothing.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  fire:
    if: >-
      github.event.sender.login == github.repository_owner
      && !github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && !contains(github.event.comment.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: >-
          curl -sSf -X POST "$URL"
          -H "Authorization: Bearer $TOKEN"
          -H "anthropic-beta: experimental-cc-routine-2026-04-01"
          -H "anthropic-version: 2023-06-01"
          -H "Content-Type: application/json"
          -d "{\"text\": \"$ISSUE\"}"
        env:
          URL: ${{ vars.TRIAGE_ROUTINE_URL }}
          TOKEN: ${{ secrets.TRIAGE_ROUTINE_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
