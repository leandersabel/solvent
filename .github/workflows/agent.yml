name: Agent

# A run started for one issue is named after it.
run-name: "${{ github.event.inputs.issue && format('Agent: {0}', github.event.inputs.issue) || '' }}"

# Every event that can move an issue along the loop runs the `advance`
# skill for that issue (CLAUDE.md, The loop). The route job decides which
# issue, if any, from who acted and on what, before any agent runs.
on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Check]
    types: [completed]
  push:
    branches: [master]
  # Hourly, the queue starts what usage held back.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number, `alerts` to file an issue for every open code scanning alert, or `queue` to start the first issue in line
        required: true
      resume:
        description: Set by a run that left work for a fresh run to continue
        type: boolean
        default: false

permissions: {}

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
      security-events: read
    outputs:
      issue: ${{ steps.route.outputs.issue }}
      queue: ${{ steps.route.outputs.queue }}
    steps:
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          jqe() { jq -r "$1" "$GITHUB_EVENT_PATH"; }
          from_branch() { sed -nE "s#^claude/(spec|issue)-([0-9]+)\$#\2#p" <<<"$1"; }
          dispatch() { gh workflow run agent.yml --ref master -f issue="$1"; }
          # Each code scanning alert on master gets an issue of its own,
          # which waits in line as filed (CLAUDE.md, The loop, Findings).
          # One whose fix merged, yet a later scan still finds it, reopens
          # once and then goes to the client.
          file_alerts() {
            local filed n alert found number state reason fix
            filed=$(gh issue list --state all --label code-scanning --limit 1000 --json number,title,state,stateReason)
            for n in $(gh api --paginate "repos/$GH_REPO/code-scanning/alerts?state=open&ref=refs/heads/master" --jq '.[].number'); do
              alert=$(gh api "repos/$GH_REPO/code-scanning/alerts/$n")
              found=$(jq -r --arg p "Code scanning alert $n:" \
                '[.[] | select(.title | startswith($p))][0] // empty | "\(.number) \(.state) \(.stateReason)"' <<<"$filed")
              read -r number state reason <<<"$found"
              if [ -z "$number" ]; then
                rating="severity: $(jq -r '.rule.security_severity_level // (if .rule.severity == "error" then "medium" else "low" end)' <<<"$alert")"
                gh label create "$rating" >/dev/null 2>&1 || true
                gh issue create --label code-scanning --label "$rating" --label queued \
                  --title "Code scanning alert $n: $(jq -r .rule.description <<<"$alert")" \
                  --body "$(jq -r '"\(.rule.security_severity_level // .rule.severity) severity, rule `\(.rule.id)`, in `\(.most_recent_instance.location.path)` line \(.most_recent_instance.location.start_line).\n\n> \(.most_recent_instance.message.text)\n\n\(.html_url)"' <<<"$alert")"
                queue=true
              elif [ "$state" = CLOSED ] && [ "$reason" = COMPLETED ]; then
                # Until master is scanned after the fix, the alert is
                # still open on the scan before it.
                fix=$(gh issue view "$number" --json closedByPullRequestsReferences --jq '.closedByPullRequestsReferences[-1].number // empty')
                [ -n "$fix" ] || continue
                fix=$(gh pr view "$fix" --json mergeCommit --jq '.mergeCommit.oid // empty')
                [ -n "$fix" ] || continue
                case $(gh api "repos/$GH_REPO/compare/$fix...$(jq -r .most_recent_instance.commit_sha <<<"$alert")" --jq .status) in
                  identical|ahead) ;;
                  *) continue ;;
                esac
                if [ "$(gh api --paginate "repos/$GH_REPO/issues/$number/timeline" --jq '.[] | select(.event == "reopened") | 1' | wc -l)" -eq 0 ]; then
                  gh issue reopen "$number" --comment "The alert is still open on master after this issue's fix merged."
                  gh issue edit "$number" --add-label queued
                  queue=true
                else
                  gh issue reopen "$number"
                  gh issue edit "$number" --add-label stuck
                  gh issue comment "$number" --body "@$OWNER The alert is still open on master after a second fix merged. Any comment here starts the next run."
                fi
              fi
            done
          }
          sender=$(jqe .sender.login)
          issue=
          # Set when the event can free the implementation slot or fill
          # the queue, so the queue job looks.
          queue=
          case "$EVENT" in
            issues)
              if [ "$(jqe .action)" = closed ]; then
                # A closed issue gives up its place in line and the slot.
                gh issue edit "$(jqe .issue.number)" --remove-label queued || true
                for n in $(gh issue list --state closed --label implementing --json number --jq '.[].number'); do
                  gh issue edit "$n" --remove-label implementing
                done
                queue=true
              elif [ "$(jqe .label.name)" = accepted ] && [ "$(jqe .issue.state)" = open ]; then
                # A finding is filed in line and has no run of its own
                # (CLAUDE.md, The loop, Findings).
                jq -e '.issue.labels | any(.name == "queued")' "$GITHUB_EVENT_PATH" >/dev/null || issue=$(jqe .issue.number)
              elif [ "$(jqe .label.name)" = queued ] && [ "$sender" = "$OWNER" ]; then
                queue=true
              fi ;;
            issue_comment)
              if [ "$sender" = "$OWNER" ] && [ "$(jqe .issue.state)" = open ]; then
                if [ "$(jqe .issue.pull_request)" = null ]; then
                  issue=$(jqe .issue.number)
                else
                  issue=$(from_branch "$(gh pr view "$(jqe .issue.number)" --json headRefName --jq .headRefName)")
                fi
              fi ;;
            pull_request_review)
              # A review event runs on the pull request's ref, which the
              # `agent` environment refuses, so the run starts on master.
              if [ "$sender" = "$OWNER" ]; then
                n=$(from_branch "$(jqe .pull_request.head.ref)")
                [ -n "$n" ] && dispatch "$n"
              fi ;;
            workflow_run)
              # A failed check on an implementation needs a fix. A
              # finished check on requirements the client approved lets
              # them merge.
              if [ "$(jqe .workflow_run.head_repository.full_name)" = "$GH_REPO" ]; then
                branch=$(jqe .workflow_run.head_branch)
                # CodeQL scans master alongside the checks. An alert it
                # reports after they finish is filed by the nightly.
                [ "$branch" = master ] && file_alerts
                conclusion=$(jqe .workflow_run.conclusion)
                if [[ "$branch" == claude/issue-* && "$conclusion" == failure ]]; then
                  issue=$(from_branch "$branch")
                elif [[ "$branch" == claude/spec-* ]]; then
                  pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
                  sha=$(jqe .workflow_run.head_sha)
                  if [ -n "$pr" ] && [ "$(gh api "repos/$GH_REPO/pulls/$pr/reviews?per_page=100" \
                    --jq "any(.[]; .user.login == \"$OWNER\" and .state == \"APPROVED\" and .commit_id == \"$sha\")")" = true ]; then
                    issue=$(from_branch "$branch")
                  fi
                fi
              fi ;;
            workflow_dispatch)
              issue=$(jqe .inputs.issue)
              case "$issue" in
                alerts) issue=; file_alerts ;;
                queue) issue=; queue=true ;;
                *) [[ "$issue" =~ ^[0-9]+$ ]] || { echo "Not an issue number: $issue"; exit 1; } ;;
              esac ;;
            schedule)
              queue=true ;;
            push)
              # A merge frees the implementation slot and can leave the
              # loop's other pull requests conflicting. Each of those
              # gets a run of its own.
              for n in $(gh issue list --state closed --label implementing --json number --jq '.[].number'); do
                gh issue edit "$n" --remove-label implementing
              done
              # GitHub computes mergeability lazily after a push.
              for _ in 1 2 3 4 5 6; do
                sleep 10
                prs=$(gh pr list --state open --json headRefName,mergeable \
                  --jq '[.[] | select(.headRefName | startswith("claude/"))]')
                [ "$(jq '[.[] | select(.mergeable == "UNKNOWN")] | length' <<<"$prs")" = 0 ] && break
              done
              runs=$(jq -r '.[] | select(.mergeable == "CONFLICTING") | .headRefName' <<<"$prs" \
                | while read -r b; do from_branch "$b"; done)
              for n in $runs; do dispatch "$n"; done
              queue=true ;;
          esac
          # Not started (advance skill, step 1): no agent runs on an
          # issue that is closed, or that lacks `accepted` unless the
          # workflow opened it. A read that fails lets the run start,
          # and the skill checks again.
          if [ -n "$issue" ]; then
            started=$(gh api "repos/$GH_REPO/issues/$issue" 2>/dev/null \
              --jq '.state == "open" and (any(.labels[]; .name == "accepted") or .user.login == "github-actions[bot]")') || started=true
            [ "$started" = true ] || issue=
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "queue=$queue" >> "$GITHUB_OUTPUT"

  advance:
    needs: route
    if: needs.route.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: agent
    # One run per issue at a time. A later event waits, and the run it
    # starts reads the issue as it then stands.
    concurrency:
      group: issue-${{ needs.route.outputs.issue }}
    outputs:
      refused: ${{ steps.usage.outputs.refused }}
      usage: ${{ steps.usage.outputs.usage }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: read
      id-token: write
    steps:
      # The agent pushes only as claude[bot]: no workflow token is left
      # in git for it to fall back on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: claude
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        # The run's GitHub token lasts an hour, and nothing after it
        # can push. Below the job's limit, so the steps after it still run.
        timeout-minutes: 60
        # A headless run ends when its own turn does, so a subagent left
        # running in the background would be cut off unfinished.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Run the `advance` skill with the argument `${{ needs.route.outputs.issue }}`.
          # Its own failing checks arrive as claude[bot], and a run the
          # route job starts arrives as github-actions[bot].
          allowed_bots: claude,github-actions
          bot_id: "209825114"
          plugin_marketplaces: https://github.com/leandersabel/skald.git
          plugins: skald@skald
          # A pipeline change writes .claude/, which Claude Code refuses
          # in every other mode. The runner is discarded after the run,
          # and the loop merges a change under .claude/ only with the
          # client's approval (CLAUDE.md, The loop, Merge gate).
          claude_args: |
            --model claude-opus-5-5
            --permission-mode bypassPermissions
      # What the subscription had left as the run ended, and whether it
      # refused the run. A rejection while overage is in use is no refusal.
      - id: usage
        if: always() && steps.claude.outputs.execution_file
        env:
          SESSION: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '([.[] | select(.type == "rate_limit_event")][-1].rate_limit_info) as $limit
            | ([.[] | select(.type == "result")][-1].result // "" | tostring) as $said
            | "refused=\(($limit.status // "allowed" | IN("allowed", "allowed_warning") | not) and $limit.isUsingOverage != true
                or ($said | test("usage limit"; "i")))",
              "usage=\($limit.unifiedWindows // {})"' "$SESSION" >> "$GITHUB_OUTPUT"
      - if: always() && steps.claude.outputs.execution_file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: session
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14
      # A run that stopped before its GitHub token ended pushed what it
      # had to claude/<kind>-<issue>, with `Left to do:` in the commit
      # message and no pull request (advance skill). One fresh run
      # continues from it, unless the issue now waits on the client or
      # the subscription refused this run.
      - id: continue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.route.outputs.issue }}
          RESUME: ${{ github.event.inputs.resume }}
          REFUSED: ${{ steps.usage.outputs.refused }}
        run: |
          [ "$RESUME" != true ] && [ "$REFUSED" != true ] || exit 0
          [ "$(gh api "repos/$GH_REPO/issues/$ISSUE" \
            --jq '.state == "open" and all(.labels[]; .name != "needs-answer" and .name != "stuck")')" = true ] || exit 0
          for kind in spec issue; do
            branch="claude/$kind-$ISSUE"
            message=$(gh api "repos/$GH_REPO/commits/$branch" --jq .commit.message 2>/dev/null) || continue
            if [[ "$message" == *"Left to do:"* ]] &&
              [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              gh workflow run agent.yml --ref master -f issue="$ISSUE" -f resume=true
              echo "continued=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
      # The loop never stops in silence: a run that leaves its issue in
      # none of the states under CLAUDE.md, The loop, Issue state, labels
      # it stuck (CLAUDE.md, The loop, When something fails).
      - if: always() && steps.continue.outputs.continued != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.route.outputs.issue }}
          OWNER: ${{ github.repository_owner }}
          FINISHED: ${{ steps.claude.outcome == 'success' }}
          REFUSED: ${{ steps.usage.outputs.refused }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh api "repos/$GH_REPO/issues/$ISSUE")
          [ "$(jq -r .state <<<"$issue")" = open ] || exit 0
          if [ "$FINISHED" = true ]; then
            why="The run ended without a pull request or a question"
            # Waiting on the client or the queue, or not started.
            jq -e '[.labels[].name] as $l
              | any($l[]; . == "needs-answer" or . == "stuck" or . == "queued")
                or ((any($l[]; . == "accepted") | not) and .user.login != "github-actions[bot]")' \
              <<<"$issue" >/dev/null && exit 0
            # A pull request waits on its checks or the client's review.
            for kind in spec issue; do
              [ -z "$(gh pr list --head "claude/$kind-$ISSUE" --state open --json number --jq '.[].number')" ] || exit 0
            done
            # A requirements pull request the client closed leaves the issue to them.
            closed=$(gh pr list --head "claude/spec-$ISSUE" --state closed --json closedAt,mergedAt \
              --jq 'map(select(.mergedAt == null) | .closedAt) | max // empty')
            wrote=$(gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments" \
              --jq ".[] | select(.user.login == \"$OWNER\") | .created_at" | tail -n 1)
            [ -n "$closed" ] && [[ "$wrote" < "$closed" ]] && exit 0
          else
            why="The agent's run did not finish"
          fi
          # An issue in line or under way that the subscription refused
          # goes back in line without a word, and waits for headroom.
          if [ "$REFUSED" = true ]; then
            if jq -e 'any(.labels[]; .name == "implementing" or .name == "queued")' <<<"$issue" >/dev/null; then
              gh issue edit "$ISSUE" --remove-label implementing --add-label queued
              exit 0
            fi
            why="The subscription's usage limit stopped the run"
          fi
          gh issue edit "$ISSUE" --add-label stuck
          gh issue comment "$ISSUE" --body "@$OWNER $why: $RUN. Any comment here starts the next one."

  # One implementation runs at a time (CLAUDE.md, The loop,
  # Implementation). This job alone hands out the slot, and only one of
  # it runs at a time, so two issues never both get it. A later one
  # waiting replaces an earlier one waiting, and sees all that one would.
  queue:
    needs: [route, advance]
    if: always() && (needs.route.outputs.queue == 'true' || needs.advance.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: queue
    permissions:
      issues: write
      pull-requests: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # The issue the agent ran on, and the usage its run left.
          ISSUE: ${{ needs.route.outputs.issue }}
          REFUSED: ${{ needs.advance.outputs.refused }}
          USAGE: ${{ needs.advance.outputs.usage }}
        run: |
          # Open issues carrying label $1, read from the issues
          # themselves, because a search can lag behind a label just set.
          open_with() {
            gh api --paginate "repos/$GH_REPO/issues?state=open&labels=$1&per_page=100" \
              --jq '.[] | select(.pull_request | not)'
          }

          # The slot is only for an implementation under way. An issue
          # the agent left waiting on the client, or stuck, gives it up.
          if [ -n "$ISSUE" ]; then
            read -r has waits < <(gh api "repos/$GH_REPO/issues/$ISSUE" --jq '[.labels[].name] as $l
              | "\(.state == "open" and ($l | index("implementing")) != null) \(($l | index("needs-answer")) != null or ($l | index("stuck")) != null)"')
            if [ "$has" = true ] && { [ "$waits" = true ] ||
              [ -n "$(gh api "repos/$GH_REPO/pulls?state=open&head=$OWNER:claude/spec-$ISSUE" --jq '.[].number')" ]; }; then
              gh issue edit "$ISSUE" --remove-label implementing
            fi
          fi

          # The slot is free once no open issue carries `implementing`.
          # One that still carries `queued` was only half handed the
          # slot, and is picked again below.
          holding=$(open_with implementing | jq -r 'select(any(.labels[]; .name == "queued") | not) | .number')
          [ -z "$holding" ] || exit 0

          # Nothing starts while usage lacks headroom: a run just
          # refused, or a window near its limit that has not reset yet
          # (CLAUDE.md, The loop, Implementation). Without this run's
          # usage, the newest run's is read, and none lets the run start.
          [ "$REFUSED" != true ] || exit 0
          if [ -z "$USAGE" ] || [ "$USAGE" = "{}" ]; then
            USAGE=$(id=$(gh api "repos/$GH_REPO/actions/artifacts?name=session&per_page=1" \
                --jq '.artifacts[] | select(.expired | not) | .id') &&
              gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/session.zip" &&
              unzip -p "$RUNNER_TEMP/session.zip" claude-execution-output.json |
              jq -c '[.[] | select(.type == "rate_limit_event")][-1].rate_limit_info.unifiedWindows // {}') || USAGE="{}"
          fi
          if jq -e --argjson now "$(date +%s)" 'any((.five_hour | select(.utilization >= 0.9)),
            (.seven_day | select(.utilization >= 0.8)); .resetsAt > $now)' <<<"$USAGE" >/dev/null; then
            echo "No usage headroom: $USAGE"
            exit 0
          fi
          # First in line: the lowest-numbered critical issue, then high,
          # then any (CLAUDE.md, The loop, Severity), among those a run
          # would start on and nothing waits on the client for.
          next=$(open_with queued | jq -c '(.labels | map(.name)) as $l
            | select(($l | index("accepted")) or .user.login == "github-actions[bot]")
            | select($l | index("stuck") or index("needs-answer") | not)
            | [(if $l | index("severity: critical") then 0 elif $l | index("severity: high") then 1 else 2 end), .number]' |
            jq -s 'min // empty | .[1]')
          [ -n "$next" ] || exit 0
          gh issue edit "$next" --add-label implementing --remove-label queued
          for _ in 1 2 3; do
            if gh workflow run agent.yml --ref master -f issue="$next"; then exit 0; fi
            sleep 5
          done
          # An issue with the slot and no run would hold up the queue.
          gh issue edit "$next" --add-label queued --remove-label implementing
          exit 1
