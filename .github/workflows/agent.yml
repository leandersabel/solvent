name: Agent

# A run started for one issue is named after it.
run-name: "${{ github.event.inputs.issue && format('Agent: {0}{1}', github.event.inputs.issue, github.event.inputs.restart == 'true' && ' (restart)' || '') || '' }}"

# Every event that can move an issue along the loop runs the `advance`
# skill for that issue (CLAUDE.md, The loop). The route job decides which
# issue, if any, from who acted and on what, before any agent runs.
on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Check]
    types: [completed]
  push:
    branches: [master]
  # Hourly, a backstop for the queue, because GitHub delays and drops
  # scheduled runs.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number, `alerts` to file an issue for every open code scanning alert, or `queue` to start the first issue in line
        required: true
      resume:
        description: Set by a run that left work for a fresh run to continue
        type: boolean
        default: false
      restart:
        description: Set by the queue for an issue holding the slot with nothing in progress
        type: boolean
        default: false
      retry:
        description: How many runs in a row the model service failed on this issue
        type: number
        default: 0

permissions: {}

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
      security-events: read
    outputs:
      issue: ${{ steps.route.outputs.issue }}
    steps:
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          jqe() { jq -r "$1" "$GITHUB_EVENT_PATH"; }
          from_branch() { sed -nE "s#^claude/(spec|issue)-([0-9]+)\$#\2#p" <<<"$1"; }
          dispatch() { gh workflow run agent.yml --ref master -f issue="$1"; }
          # Whose rating counts (CLAUDE.md, The loop, Severity), and who
          # closes started work: the client, or the loop merging its fix.
          counts() { [[ "$1" == "$OWNER" || "$1" == "claude[bot]" || "$1" == "github-actions[bot]" ]]; }
          # Each code scanning alert on master gets an issue of its own,
          # which waits in line as filed (CLAUDE.md, The loop, Findings).
          # One whose fix merged, yet a later scan still finds it, reopens
          # once and then goes to the client.
          file_alerts() {
            local filed n alert found number state reason fix
            filed=$(gh issue list --state all --label code-scanning --limit 1000 --json number,title,state,stateReason)
            for n in $(gh api --paginate "repos/$GH_REPO/code-scanning/alerts?state=open&ref=refs/heads/master" --jq '.[].number'); do
              alert=$(gh api "repos/$GH_REPO/code-scanning/alerts/$n")
              found=$(jq -r --arg p "Code scanning alert $n:" \
                '[.[] | select(.title | startswith($p))][0] // empty | "\(.number) \(.state) \(.stateReason)"' <<<"$filed")
              read -r number state reason <<<"$found"
              if [ -z "$number" ]; then
                rating="severity: $(jq -r '.rule.security_severity_level // (if .rule.severity == "error" then "medium" else "low" end)' <<<"$alert")"
                gh label create "$rating" >/dev/null 2>&1 || true
                gh issue create --label code-scanning --label "$rating" --label queued \
                  --title "Code scanning alert $n: $(jq -r .rule.description <<<"$alert")" \
                  --body "$(jq -r '"\(.rule.security_severity_level // .rule.severity) severity, rule `\(.rule.id)`, in `\(.most_recent_instance.location.path)` line \(.most_recent_instance.location.start_line).\n\n> \(.most_recent_instance.message.text)\n\n\(.html_url)"' <<<"$alert")"
              elif [ "$state" = CLOSED ] && [ "$reason" = COMPLETED ]; then
                # Until master is scanned after the fix, the alert is
                # still open on the scan before it.
                fix=$(gh issue view "$number" --json closedByPullRequestsReferences --jq '.closedByPullRequestsReferences[-1].number // empty')
                [ -n "$fix" ] || continue
                fix=$(gh pr view "$fix" --json mergeCommit --jq '.mergeCommit.oid // empty')
                [ -n "$fix" ] || continue
                case $(gh api "repos/$GH_REPO/compare/$fix...$(jq -r .most_recent_instance.commit_sha <<<"$alert")" --jq .status) in
                  identical|ahead) ;;
                  *) continue ;;
                esac
                if [ "$(gh api --paginate "repos/$GH_REPO/issues/$number/timeline" --jq '.[] | select(.event == "reopened") | 1' | wc -l)" -eq 0 ]; then
                  gh issue reopen "$number" --comment "The alert is still open on master after this issue's fix merged."
                  gh issue edit "$number" --add-label queued
                else
                  gh issue reopen "$number"
                  gh issue edit "$number" --add-label stuck
                  gh issue comment "$number" --body "@$OWNER The alert is still open on master after a second fix merged. Any comment here starts the next run."
                fi
              fi
            done
          }
          sender=$(jqe .sender.login)
          issue=
          case "$EVENT" in
            issues)
              label=$(jqe .label.name)
              if [ "$(jqe .action)" = closed ]; then
                if ! counts "$sender" && jq -e '.issue | any(.labels[]; .name == "accepted") or (.user.login | IN("claude[bot]", "github-actions[bot]"))' "$GITHUB_EVENT_PATH" >/dev/null; then
                  # Only the client closes started work. Its author can
                  # close an issue without triage access.
                  gh issue reopen "$(jqe .issue.number)" --comment "Only @$OWNER or a merged pull request closes started work, so this issue is open again."
                else
                  # A closed issue gives up its place in line and the slot.
                  gh issue edit "$(jqe .issue.number)" --remove-label queued || true
                  for n in $(gh issue list --state closed --label implementing --json number --jq '.[].number'); do
                    gh issue edit "$n" --remove-label implementing
                  done
                fi
              elif [[ "$label" == "severity: "* ]] && ! counts "$sender"; then
                # A rating that does not count is removed, so the line
                # ranks only ratings that do.
                gh issue edit "$(jqe .issue.number)" --remove-label "$label"
              elif { [ "$label" = accepted ] || [ "$(jqe .action)" = opened ]; } && [ "$(jqe .issue.state)" = open ]; then
                # A finding is filed in line and has no run of its own
                # (CLAUDE.md, The loop, Findings). An issue opened by
                # anyone but the loop is not started, as checked below.
                jq -e '.issue.labels | any(.name == "queued")' "$GITHUB_EVENT_PATH" >/dev/null || issue=$(jqe .issue.number)
              fi ;;
            issue_comment)
              if [ "$sender" = "$OWNER" ] && [ "$(jqe .issue.state)" = open ]; then
                if [ "$(jqe .issue.pull_request)" = null ]; then
                  issue=$(jqe .issue.number)
                else
                  issue=$(from_branch "$(gh pr view "$(jqe .issue.number)" --json headRefName --jq .headRefName)")
                fi
              fi ;;
            pull_request_review)
              # A review event runs on the pull request's ref, which the
              # `agent` environment refuses, so the run starts on master.
              if [ "$sender" = "$OWNER" ]; then
                n=$(from_branch "$(jqe .pull_request.head.ref)")
                [ -n "$n" ] && dispatch "$n"
              fi ;;
            workflow_run)
              # A failed check on an implementation needs a fix. A
              # finished check on requirements the client approved lets
              # them merge.
              if [ "$(jqe .workflow_run.head_repository.full_name)" = "$GH_REPO" ]; then
                branch=$(jqe .workflow_run.head_branch)
                # CodeQL scans master alongside the checks. An alert it
                # reports after they finish is filed by the nightly.
                [ "$branch" = master ] && file_alerts
                conclusion=$(jqe .workflow_run.conclusion)
                if [[ "$branch" == claude/issue-* && "$conclusion" == failure ]]; then
                  issue=$(from_branch "$branch")
                elif [[ "$branch" == claude/spec-* ]]; then
                  pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
                  sha=$(jqe .workflow_run.head_sha)
                  if [ -n "$pr" ] && [ "$(gh api "repos/$GH_REPO/pulls/$pr/reviews?per_page=100" \
                    --jq "any(.[]; .user.login == \"$OWNER\" and .state == \"APPROVED\" and .commit_id == \"$sha\")")" = true ]; then
                    issue=$(from_branch "$branch")
                  fi
                fi
              fi ;;
            workflow_dispatch)
              issue=$(jqe .inputs.issue)
              case "$issue" in
                alerts) issue=; file_alerts ;;
                queue) issue= ;;
                *) [[ "$issue" =~ ^[0-9]+$ ]] || { echo "Not an issue number: $issue"; exit 1; } ;;
              esac ;;
            push)
              # A merge frees the implementation slot and can leave the
              # loop's other pull requests conflicting. Each of those
              # gets a run of its own.
              for n in $(gh issue list --state closed --label implementing --json number --jq '.[].number'); do
                gh issue edit "$n" --remove-label implementing
              done
              # GitHub computes mergeability lazily after a push.
              for _ in 1 2 3 4 5 6; do
                sleep 10
                prs=$(gh pr list --state open --json headRefName,mergeable \
                  --jq '[.[] | select(.headRefName | startswith("claude/"))]')
                [ "$(jq '[.[] | select(.mergeable == "UNKNOWN")] | length' <<<"$prs")" = 0 ] && break
              done
              runs=$(jq -r '.[] | select(.mergeable == "CONFLICTING") | .headRefName' <<<"$prs" \
                | while read -r b; do from_branch "$b"; done)
              for n in $runs; do dispatch "$n"; done ;;
          esac
          # Not started (advance skill, step 1): no agent runs on an
          # issue that is closed, or that lacks `accepted` unless the
          # loop or the workflow opened it. A read that fails lets the run start,
          # and the skill checks again.
          if [ -n "$issue" ]; then
            started=$(gh api "repos/$GH_REPO/issues/$issue" 2>/dev/null \
              --jq '.state == "open" and (any(.labels[]; .name == "accepted") or (.user.login | IN("claude[bot]", "github-actions[bot]")))') || started=true
            [ "$started" = true ] || issue=
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

  advance:
    # Named after its issue, so the queue job sees a run under way on it.
    name: advance ${{ needs.route.outputs.issue }}
    needs: route
    if: needs.route.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: agent
    # One run per issue at a time. A later event waits, and the run it
    # starts reads the issue as it then stands.
    concurrency:
      group: issue-${{ needs.route.outputs.issue }}
    outputs:
      refused: ${{ steps.usage.outputs.refused }}
      failed: ${{ steps.usage.outputs.failed }}
      usage: ${{ steps.usage.outputs.usage }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: read
      id-token: write
    steps:
      # The agent pushes only as claude[bot]: no workflow token is left
      # in git for it to fall back on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: claude
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        # The run's GitHub token lasts an hour, and nothing after it
        # can push. Below the job's limit, so the steps after it still run.
        timeout-minutes: 60
        # A headless run ends when its own turn does, so a subagent left
        # running in the background would be cut off unfinished.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: Run the `advance` skill with the argument `${{ needs.route.outputs.issue }}`.
          # Its own failing checks arrive as claude[bot], and a run the
          # route job starts arrives as github-actions[bot].
          allowed_bots: claude,github-actions
          bot_id: "209825114"
          plugin_marketplaces: https://github.com/leandersabel/skald.git
          plugins: skald@skald
          # A pipeline change writes .claude/, which Claude Code refuses
          # in every other mode. The runner is discarded after the run,
          # and the loop merges a change under .claude/ only with the
          # client's approval (CLAUDE.md, The loop, Merge gate).
          claude_args: |
            --model claude-opus-5-5
            --permission-mode bypassPermissions
      # What the subscription had left as the run ended, whether it
      # refused the run, and whether the model service failed it. A
      # rejection while overage is in use is no refusal, and a run that
      # ended well only quoted the words.
      - id: usage
        if: always() && steps.claude.outputs.execution_file
        env:
          SESSION: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '([.[] | select(.type == "rate_limit_event")][-1].rate_limit_info) as $limit
            | ([.[] | select(.type == "result")][-1].result // "" | tostring) as $said
            | "refused=\(($limit.status // "allowed" | IN("allowed", "allowed_warning") | not) and $limit.isUsingOverage != true
                or ([.[] | select(.type == "result")][-1].is_error == true and ($said | test("usage limit"; "i"))))",
              "failed=\([.[] | select(.type == "result")][-1].is_error == true
                and ($said | test("API Error|overloaded"; "i")) and ($said | test("usage limit"; "i") | not))",
              "usage=\($limit.unifiedWindows // {})"' "$SESSION" >> "$GITHUB_OUTPUT"
      - if: always() && steps.claude.outputs.execution_file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: session
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14
      # A run that stopped before its GitHub token ended pushed what it
      # had to claude/<kind>-<issue>, with `Left to do:` in the commit
      # message and no pull request (advance skill). One fresh run
      # continues from it, unless the issue now waits on the client or
      # the subscription refused this run.
      - id: continue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.route.outputs.issue }}
          RESUME: ${{ github.event.inputs.resume }}
          REFUSED: ${{ steps.usage.outputs.refused }}
          FAILED: ${{ steps.usage.outputs.failed }}
        run: |
          [ "$RESUME" != true ] && [ "$REFUSED" != true ] && [ "$FAILED" != true ] || exit 0
          [ "$(gh api "repos/$GH_REPO/issues/$ISSUE" \
            --jq '.state == "open" and all(.labels[]; .name != "needs-answer" and .name != "stuck")')" = true ] || exit 0
          for kind in spec issue; do
            branch="claude/$kind-$ISSUE"
            message=$(gh api "repos/$GH_REPO/commits/$branch" --jq .commit.message 2>/dev/null) || continue
            if [[ "$message" == *"Left to do:"* ]] &&
              [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              gh workflow run agent.yml --ref master -f issue="$ISSUE" -f resume=true
              echo "continued=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
      # The loop never stops in silence: a run that leaves its issue in
      # none of the states under CLAUDE.md, The loop, Issue state, labels
      # it stuck (CLAUDE.md, The loop, When something fails).
      - if: always() && steps.continue.outputs.continued != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.route.outputs.issue }}
          OWNER: ${{ github.repository_owner }}
          FINISHED: ${{ steps.claude.outcome == 'success' }}
          REFUSED: ${{ steps.usage.outputs.refused }}
          FAILED: ${{ steps.usage.outputs.failed }}
          RETRY: ${{ github.event.inputs.retry || 0 }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh api "repos/$GH_REPO/issues/$ISSUE")
          [ "$(jq -r .state <<<"$issue")" = open ] || exit 0
          # A failure of the model service passes on its own: the retry
          # job starts the run again, up to the third failure in a row.
          if [ "$FAILED" = true ]; then
            [ "$RETRY" -ge 2 ] || exit 0
            why="The model service failed three runs in a row, the last"
          elif [ "$FINISHED" = true ]; then
            why="The run ended without a pull request or a question"
            # Waiting on the client or the queue, or not started.
            jq -e '[.labels[].name] as $l
              | any($l[]; . == "needs-answer" or . == "stuck" or . == "queued")
                or ((any($l[]; . == "accepted") | not) and (.user.login | IN("claude[bot]", "github-actions[bot]") | not))' \
              <<<"$issue" >/dev/null && exit 0
            # A pull request waits on its checks or the client's review.
            for kind in spec issue; do
              [ -z "$(gh pr list --head "claude/$kind-$ISSUE" --state open --json number --jq '.[].number')" ] || exit 0
            done
            # A requirements pull request the client closed leaves the issue to them.
            closed=$(gh pr list --head "claude/spec-$ISSUE" --state closed --json closedAt,mergedAt \
              --jq 'map(select(.mergedAt == null) | .closedAt) | max // empty')
            wrote=$(gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments" \
              --jq ".[] | select(.user.login == \"$OWNER\") | .created_at" | tail -n 1)
            [ -n "$closed" ] && [[ "$wrote" < "$closed" ]] && exit 0
          else
            why="The agent's run did not finish"
          fi
          # An issue in line or under way that the subscription refused
          # goes back in line without a word, and waits for headroom. One
          # with an open pull request keeps it and the slot.
          if [ "$REFUSED" = true ]; then
            if jq -e 'any(.labels[]; .name == "implementing" or .name == "queued")' <<<"$issue" >/dev/null &&
              [ -z "$(gh pr list --head "claude/issue-$ISSUE" --state open --json number --jq '.[].number')" ]; then
              gh issue edit "$ISSUE" --remove-label implementing --add-label queued
              exit 0
            fi
            why="The subscription's usage limit stopped the run"
          fi
          # The queue job tends an issue holding the slot (CLAUDE.md, The
          # loop, Implementation).
          jq -e 'any(.labels[]; .name == "implementing")' <<<"$issue" >/dev/null && exit 0
          gh issue edit "$ISSUE" --add-label stuck
          gh issue comment "$ISSUE" --body "@$OWNER $why: $RUN. Any comment here starts the next one."

  # A run the model service failed starts again fifteen minutes later,
  # with its issue where it was (CLAUDE.md, The loop, When something
  # fails). The third failure in a row leaves it stuck.
  retry:
    needs: [route, advance]
    if: always() && needs.advance.outputs.failed == 'true' && (github.event.inputs.retry || 0) < 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.route.outputs.issue }}
          RESUME: ${{ github.event.inputs.resume || false }}
          RETRY: ${{ github.event.inputs.retry || 0 }}
        run: |
          sleep 900
          [ "$(gh api "repos/$GH_REPO/issues/$ISSUE" \
            --jq '.state == "open" and all(.labels[]; .name != "needs-answer" and .name != "stuck")')" = true ] || exit 0
          gh workflow run agent.yml --ref master -f issue="$ISSUE" -f resume="$RESUME" -f retry=$((RETRY + 1))

  # One implementation runs at a time (CLAUDE.md, The loop,
  # Implementation). This job alone hands out the slot and tends its
  # holder, on every event, and only one of it runs at a time, so two
  # issues never both get it. A later one waiting replaces an earlier
  # one waiting, and sees all that one would.
  queue:
    needs: [route, advance]
    if: always() && needs.route.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: queue
    outputs:
      until: ${{ steps.queue.outputs.until }}
    permissions:
      issues: write
      pull-requests: read
      actions: write
      checks: read
      contents: read
    steps:
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # The issue the agent ran on, and the usage its run left.
          ISSUE: ${{ needs.route.outputs.issue }}
          REFUSED: ${{ needs.advance.outputs.refused }}
          USAGE: ${{ needs.advance.outputs.usage }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Open issues carrying label $1, read from the issues
          # themselves, because a search can lag behind a label just set.
          open_with() {
            gh api --paginate "repos/$GH_REPO/issues?state=open&labels=$1&per_page=100" \
              --jq '.[] | select(.pull_request | not)'
          }
          # Issues holding the slot, each read on its own, because a list
          # filtered by label can still show a label just removed. One
          # this job freed never holds it. One that still carries
          # `queued` was only half handed it, and is picked again below.
          freed=
          holders() {
            open_with implementing | jq -r .number | while read -r n; do
              [[ " $freed " == *" $n "* ]] ||
                gh api "repos/$GH_REPO/issues/$n" --jq '[.labels[].name] as $l
                  | select(.state == "open" and ($l | index("implementing")) and ($l | index("queued") | not)) | .number'
            done
          }
          # Every way the job ends without starting a run says why on
          # the run's page.
          idle() {
            echo "::notice title=Nothing started::$1"
            echo "Nothing started: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # The slot is only for an implementation that can move. An
          # issue waiting on the client, or returned to its requirements,
          # gives it up. One blocked by another issue goes back in line
          # behind its cause.
          for n in $(holders); do
            labels=$(gh api "repos/$GH_REPO/issues/$n" --jq '[.labels[].name]')
            if jq -e 'index("blocked")' <<<"$labels" >/dev/null; then
              gh issue edit "$n" --remove-label implementing --add-label queued
              freed="$freed $n"
            elif jq -e 'index("needs-answer") or index("stuck")' <<<"$labels" >/dev/null ||
              [ -n "$(gh pr list --head "claude/spec-$n" --state open --json number --jq '.[].number')" ]; then
              gh issue edit "$n" --remove-label implementing
              freed="$freed $n"
            fi
          done

          # Nothing starts while usage lacks headroom: a run just
          # refused, or a window near its limit that has not reset yet
          # (CLAUDE.md, The loop, Implementation). Without this run's
          # usage, the newest run's is read, and none lets the run start.
          # A hold shows on the run's page, and the wait job starts the
          # queue again once the window resets.
          hold() {
            echo "::notice title=Queue held::$1"
            echo "Queue held: $1" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$2" ] || echo "until=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "$USAGE" ] || [ "$USAGE" = "{}" ]; then
            USAGE=$(id=$(gh api "repos/$GH_REPO/actions/artifacts?name=session&per_page=30" \
                --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].id // empty') &&
              [ -n "$id" ] &&
              gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/session.zip" &&
              unzip -p "$RUNNER_TEMP/session.zip" claude-execution-output.json |
              jq -c '[.[] | select(.type == "rate_limit_event")][-1].rate_limit_info.unifiedWindows // {}') || USAGE="{}"
          fi
          # The windows yet to reset, and those of them near their limit.
          windows=$(jq -c --argjson now "$(date +%s)" '[{name: "five-hour", limit: 0.9} + (.five_hour // empty),
              {name: "weekly", limit: 0.8} + (.seven_day // empty)] | map(select(.resetsAt > $now))' <<<"$USAGE")
          full=$(jq -c 'map(select(.utilization >= .limit))' <<<"$windows")
          # A refused run waits for the windows near their limit, or else
          # the first to reset.
          [ "$REFUSED" != true ] || hold "the subscription refused the run on #$ISSUE for its usage limit." \
            "$(jq --argjson full "$full" '($full | max_by(.resetsAt)) // min_by(.resetsAt) | .resetsAt // empty' <<<"$windows")"
          [ "$full" = "[]" ] || hold "$(jq -r 'map("the \(.name) window is at \(.utilization * 100 | round) percent until \(.resetsAt | todate)") | join(", and ")' <<<"$full")." \
            "$(jq 'max_by(.resetsAt).resetsAt' <<<"$full")"

          # Something is in progress on issue $1: a run on it, or checks
          # on its pull request. Checks that finished, or a commit pushed,
          # in the last five minutes count too, while GitHub starts the
          # checks or the merge, and the job waits that out.
          under_way() {
            local runs id sha checks wait
            runs=$(gh api "repos/$GH_REPO/actions/workflows/agent.yml/runs?per_page=100" |
              jq -c --argjson self "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.status != "completed" and .id != $self)]')
            jq -e --arg t "Agent: $1" 'any(.[]; .display_title == $t or .display_title == $t + " (restart)")' <<<"$runs" >/dev/null && return 0
            for id in $(jq -r '.[].id' <<<"$runs"); do
              gh api --paginate "repos/$GH_REPO/actions/runs/$id/jobs" --jq '.jobs[] | select(.status != "completed") | .name' |
                grep -qx "advance $1" && return 0
            done
            sha=$(gh pr list --head "claude/issue-$1" --state open --json headRefOid --jq '.[0].headRefOid // empty')
            [ -n "$sha" ] || return 1
            checks=$(gh api --paginate "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs[]' | jq -s .)
            jq -e 'any(.[]; .status != "completed")' <<<"$checks" >/dev/null && return 0
            wait=$(jq -r --arg pushed "$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.committer.date)" \
              '[$pushed] + map(.completed_at) | max | fromdate + 300 - now | floor' <<<"$checks")
            [ "$wait" -gt 0 ] || return 1
            sleep "$wait"
            under_way "$1"
          }

          # A holder with nothing in progress gets a fresh run, which
          # takes its next step (advance skill). Three of them without a
          # new commit on its branch since it got the slot, and it is
          # stuck and gives the slot up.
          holder=$(holders | head -n 1)
          if [ -n "$holder" ]; then
            under_way "$holder" && idle "#$holder holds the slot, with a run or checks in progress."
            since=$({
              gh api --paginate "repos/$GH_REPO/issues/$holder/timeline" \
                --jq '.[] | select(.event == "labeled" and .label.name == "implementing") | .created_at'
              gh api "repos/$GH_REPO/commits/claude/issue-$holder" --jq .commit.committer.date 2>/dev/null || true
            } | sort | tail -n 1)
            restarts=$(gh api -X GET "repos/$GH_REPO/actions/workflows/agent.yml/runs" \
              -f event=workflow_dispatch -f created=">=$since" -F per_page=100 |
              jq --arg t "Agent: $holder (restart)" '[.workflow_runs[] | select(.display_title == $t)] | length')
            if [ "$restarts" -lt 3 ]; then
              gh workflow run agent.yml --ref master -f issue="$holder" -f restart=true
              exit 0
            fi
            gh issue edit "$holder" --add-label stuck --remove-label implementing
            gh issue comment "$holder" --body "@$OWNER This issue held the implementation slot with nothing in progress, and three fresh runs brought no new commit: $RUN. It gave the slot up. Any comment here starts the next run."
          fi

          # Each open blocked issue, with the causes it names that are
          # still open, from the loop's comments on it (advance skill,
          # step 4).
          blocked=$(open_with blocked | jq -r .number | while read -r n; do
            gh api --paginate "repos/$GH_REPO/issues/$n/comments" \
              --jq '.[] | select(.user.login == "claude[bot]") | .body' |
              sed -nE 's/^<!-- blocked-by: #([0-9]+) -->\r?$/\1/p' | sort -u |
              while read -r c; do gh api "repos/$GH_REPO/issues/$c" --jq 'select(.state == "open") | .number'; done |
              jq -s --argjson n "$n" '{number: $n, open: .}'
          done | jq -s -c .)
          # First in line: the cause of a blocked issue, then a blocked
          # issue whose causes are closed, then the lowest-numbered
          # critical issue, then high, then any (CLAUDE.md, The loop,
          # Implementation), among those a run would start on and nothing
          # waits on the client for.
          next=$(open_with queued | jq -c --argjson blocked "$blocked" '(.labels | map(.name)) as $l | .number as $n
            | select(($l | index("accepted")) or (.user.login | IN("claude[bot]", "github-actions[bot]")))
            | select($l | index("stuck") or index("needs-answer") | not)
            | ($blocked | map(select(.number == $n))[0]) as $b
            | select($b == null or ($b.open | length) == 0)
            | [(if any($blocked[]; any(.open[]; . == $n)) then 0 elif $b then 1
                elif $l | index("severity: critical") then 2 elif $l | index("severity: high") then 3 else 4 end), $n]' |
            jq -s 'min // empty | .[1]')
          [ -n "$next" ] || idle "no issue is in line."
          gh issue edit "$next" --add-label implementing --remove-label queued
          for _ in 1 2 3; do
            if gh workflow run agent.yml --ref master -f issue="$next"; then
              if jq -e --argjson n "$next" 'any(.[]; .number == $n)' <<<"$blocked" >/dev/null; then
                gh issue edit "$next" --remove-label blocked
              fi
              exit 0
            fi
            sleep 5
          done
          # An issue with the slot and no run would hold up the queue.
          gh issue edit "$next" --add-label queued --remove-label implementing
          echo "::error title=Nothing started::The run on #$next could not be started, and it went back in line."
          exit 1

  # A queue the usage limit holds starts again once the window resets,
  # because the hourly schedule is delayed and dropped. A job runs at
  # most six hours, so a longer wait ends early, and the queue, still
  # held, starts the next. A later hold replaces this one.
  wait:
    needs: queue
    if: always() && needs.queue.outputs.until != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: wait
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UNTIL: ${{ needs.queue.outputs.until }}
        run: |
          left=$(( UNTIL + 60 - $(date +%s) ))
          sleep $(( left > 18000 ? 18000 : left > 0 ? left : 0 ))
          gh workflow run agent.yml --ref master -f issue=queue
