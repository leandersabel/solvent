name: Nightly

# On a night code on master changed and its push check passed, its image
# is built and published as a dev build of the next release. QA then
# hunts the features that changed (CLAUDE.md, The loop, Nightly and
# stable).
on:
  # 1 a.m. in Switzerland in winter and 2 a.m. in summer, so a start
  # GitHub delays by hours still finishes by morning. Off the hour,
  # when GitHub delays least, and after midnight UTC, so the UTC date a
  # version is named after is the date in Switzerland.
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency: nightly

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  decide:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
      version: ${{ steps.decide.outputs.version }}
      base: ${{ steps.decide.outputs.base }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # At most one dev build a night, and none for a night whose only
      # changes are to the spec, the docs or the pipeline. The push check
      # of the last commit that changed anything the tests read must have
      # passed, because a version is made only of a tested master.
      - id: decide
        run: |
          month=$(date -u +%Y.%m)
          last=$(git tag --list '*-dev.*' --sort=-creatordate | head -n 1)
          stable=$(git tag --list "$month.*" | grep -vE -- '-(dev|rc)\.' | sort -V | tail -n 1)
          n=0
          [ -z "$stable" ] || n=$(( ${stable##*.} + 1 ))
          version="$month.$n-dev.$(date -u +%Y%m%d)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ -z "$last" ] || echo "base=$(git rev-parse "$last^{commit}")" >> "$GITHUB_OUTPUT"
          if [ -n "$(git tag --list "*-dev.$(date -u +%Y%m%d)")" ]; then
            echo "Tonight's dev build exists."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$last" ] && ! git diff --name-only "$last" HEAD | grep -qvE '^(spec/|\.github/|\.claude/|CLAUDE\.md|README\.md)'; then
            echo "No code changed since $last."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git log -1 --format=%H HEAD -- . ':(exclude).claude/' ':(exclude,glob)*.md')
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?event=push&branch=master&head_sha=$code" --jq '.workflow_runs[].id'); do
            if [ -n "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "test" and .conclusion == "success") | .id')" ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::notice::The push check of $code has not passed, so tonight makes no version."
          echo "go=false" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  publish:
    needs: [decide, build]
    if: always() && (needs.decide.result == 'failure' || needs.decide.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.decide.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: publish
        run: |
          [ -n "$DIGEST" ]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:nightly" "$IMAGE@$DIGEST"
          .github/actions/notes/notes.sh "$VERSION" "$GITHUB_SHA" "$IMAGE@$DIGEST" > notes.md
          gh release create "$VERSION" --target "$GITHUB_SHA" --prerelease --title "$VERSION" --notes-file notes.md

      # Files any code scanning alert the route after a merge missed.
      - if: always()
        run: gh workflow run agent.yml --ref master -f issue=alerts

      # A failed night always leaves an issue the loop takes up.
      - if: failure() || cancelled()
        uses: ./.github/actions/nightly-failure
        with:
          stage: nightly
          today: ${{ env.VERSION }}
          steps: ${{ toJSON(steps) }}
          needs: ${{ toJSON(needs) }}

  hunt:
    needs: [decide, build, publish]
    uses: ./.github/workflows/hunt.yml
    permissions:
      actions: write
      contents: read
      issues: write
      packages: read
    with:
      digest: ${{ needs.build.outputs.digest }}
      base: ${{ needs.decide.outputs.base }}
