name: Bug
description: Something in the app does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what the app did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The screen, and a screenshot if you have one.
